version: 2
updates:
  # Backend (Express + Prisma)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-production:
        dependency-type: production
      backend-development:
        dependency-type: development

  # Frontend (React + Vite)
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Base images (node:22.23.4-alpine, nginx:1.30.6-alpine)
  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: weekly
