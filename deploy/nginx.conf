events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # No revelar la versión de Nginx en respuestas y páginas de error.
    server_tokens off;

    # Subidas del cotizador (PDFs) y adjuntos del CRM: 60 MB máximo.
    client_max_body_size 60m;

    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    # DNS embebido de Docker: resuelve los contenedores del cotizador por
    # nombre en cada petición, de modo que Nginx arranca y sigue sirviendo
    # el CRM aunque el stack del cotizador no esté corriendo todavía.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name cotizador.chicologistica.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name cotizador.chicologistica.com;

        ssl_certificate     /etc/letsencrypt/live/cotizador.chicologistica.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cotizador.chicologistica.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/cotizador.chicologistica.com/chain.pem;

        # Endurecimiento TLS: solo protocolos modernos, sesiones cacheadas y
        # OCSP stapling para que el cliente no consulte al emisor del certificado.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Cabeceras de seguridad para respuestas servidas por Nginx (las de la
        # app las añade helmet). HSTS sin includeSubDomains para no afectar a
        # otros subdominios que aún no sirvan por HTTPS.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---- Panel CRM (raíz del dominio) ----
        location = / {
            return 301 /crm/;
        }
        location = /crm {
            return 301 /crm/;
        }
        location /crm {
            limit_req zone=mylimit burst=20 nodelay;
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- API del CRM ----
        location /api/crm/ {
            limit_req zone=mylimit burst=20 nodelay;
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off; # SSE de notificaciones en tiempo real
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Webhook de Meta (verificación GET + mensajes POST firmados)
        location /api/bot/ {
            limit_req zone=mylimit burst=20 nodelay;
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Callback del cotizador hacia el CRM (quote.status.updated)
        location /api/integrations/ {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Cotizador: API (webhooks entrantes del CRM y consultas de su web) ----
        # Los contenedores del cotizador usan container_name cotizador-api y
        # cotizador-web y se unen a la red compartida deploy_mudanzas_net.
        location /api/webhooks/ {
            set $cotizador_api http://cotizador-api:3001;
            proxy_pass $cotizador_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/quotes {
            set $cotizador_api http://cotizador-api:3001;
            proxy_pass $cotizador_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Archivos públicos del cotizador (PDFs de estimados). Meta los
        # descarga con un GET plano para adjuntarlos a los mensajes de WhatsApp.
        location /files/ {
            set $cotizador_api http://cotizador-api:3001;
            proxy_pass $cotizador_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Cotizador: web UI (SPA con VITE_BASE=/cotizador/) ----
        location = /cotizador {
            return 301 /cotizador/;
        }
        location /cotizador/ {
            set $cotizador_web http://cotizador-web;
            proxy_pass $cotizador_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fallback: cualquier otra ruta la atiende el CRM (comportamiento previo).
        location / {
            limit_req zone=mylimit burst=20 nodelay;
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
