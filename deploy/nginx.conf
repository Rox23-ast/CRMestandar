events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    server {
        listen 80;
        server_name cotizador.chicologistica.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name cotizador.chicologistica.com;

        ssl_certificate     /etc/letsencrypt/live/cotizador.chicologistica.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cotizador.chicologistica.com/privkey.pem;

        location / {
            limit_req zone=mylimit burst=20 nodelay;
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
