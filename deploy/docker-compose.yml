version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: mudanzas_backend
    restart: always
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=file:/app/data/mudanzas.db
    expose:
      - "3000"
    volumes:
      - sqlite_data:/app/data
    networks:
      - mudanzas_net

  nginx:
    # Pinned stable branch (patched 2026-10-22). Update this tag deliberately
    # when a new nginx security release is published.
    image: nginx:1.30.6-alpine
    container_name: mudanzas_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - mudanzas_net

volumes:
  sqlite_data:

networks:
  mudanzas_net:
    driver: bridge
    # Nombre explícito: el stack del cotizador se une a esta red como
    # `external: true` y Nginx resuelve cotizador-api/cotizador-web.
    name: deploy_mudanzas_net
