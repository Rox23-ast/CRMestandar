version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: mudanzas_backend
    restart: always
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=file:/app/data/mudanzas.db
    expose:
      - "3000"
    volumes:
      - sqlite_data:/app/data
    networks:
      - mudanzas_net

  nginx:
    image: nginx:alpine
    container_name: mudanzas_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - mudanzas_net

volumes:
  sqlite_data:

networks:
  mudanzas_net:
    driver: bridge
