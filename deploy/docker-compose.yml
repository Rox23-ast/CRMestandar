version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: mudanzas_backend
    restart: always
    env_file:
      - ../.env
    expose:
      - "3000"
    networks:
      - mudanzas_net

  nginx:
    image: nginx:alpine
    container_name: mudanzas_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - mudanzas_net

volumes:
  sqlite_data:

networks:
  mudanzas_net:
    driver: bridge
